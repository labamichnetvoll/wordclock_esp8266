<!DOCTYPE HTML>

	<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
	
	body{
		background-color: #222222;
		font-family: -apple-system, 
			BlinkMacSystemFont, 
			"Segoe UI", 
			Roboto, 
			Oxygen-Sans, 
			Ubuntu, 
			Cantarell, 
			"Helvetica Neue", 
			sans-serif;
		color: white;
		background: linear-gradient(90deg, #ffa9a9, #64a1e0, #ffa9a9, #64a1e0);
		background-size: 400% 400%;
		-webkit-animation: gradientBG 14s ease infinite forwards;
		animation: gradientBG 14s ease infinite forwards;
		font-weight: lighter;
	}
	/** Animated background: Code By Webdevtrick ( https://webdevtrick.com ) **/
	@-webkit-keyframes gradientBG {
		0% {
			background-position: 0% 50%;
		}
		50% {
			background-position: 100% 50%;
		}
		100% {
			background-position: 0% 50%;
		}
	}
	
	@keyframes gradientBG {
		0% {
			background-position: 0% 50%;
		}
		50% {
			background-position: 100% 50%;
		}
		100% {
			background-position: 0% 50%;
		}
	}
	
	h1 {
	  font-weight: lighter;
	  letter-spacing: .125rem;
	  text-transform: uppercase;
	  color: white;
	  text-align: center;
	  font-size: x-large;
	}
	
	.buttonClass {
	  font-size:15px;
	  font-family:Arial;
	  width:70px;
	  height:70px;
	  color:#fff;
	  font-weight:200;
	  border-top-left-radius:14px;
	  border-top-right-radius:14px;
	  border-bottom-left-radius:14px;
	  border-bottom-right-radius:14px;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  -moz-user-select: none;
	  -webkit-user-select: none;
	  -ms-user-select:none;
	  user-select:none;
	  -o-user-select:none;
	}

	.buttonClass:hover {
	  opacity: 0.7;
	}
	
	.grid-container {
	  font-size:15px;
	  font-family:Arial;
	  display: grid;
	  grid-column-gap: 5px;
	  grid-row-gap: 5px;
	  grid-template-columns: auto auto auto;
	  padding: 10px;
	}

	.grid-item {
	  text-align: center;
	  display: inline-block;
	  text-align: center;
	}

	.dot {
		border-radius: 20%;
		display: flex;
		justify-content: center; /* align horizontal */
		align-items: center; /* align vertical */
	}

	.dot-mode {
		display: flex;
		justify-content: center; /* align horizontal */
		align-items: center; /* align vertical */
	}

	.active{
		border: 2px solid lightgray;
	}

	.mode-item{
		background: rgba(59, 57, 57, 0.308);
	}

	.mode-item:hover{
		opacity: 0.7;
	}

	.verticalline{
		border-bottom: 1px solid rgba(255, 255, 255, 0.356);
    	text-align: center;
    	color: white;
	}

	input[type="checkbox"]{
		-webkit-appearance: none;
		-moz-appearance: none;
		appearance: none;
		-webkit-tap-highlight-color: transparent;
		cursor: pointer;
	}


	.toggle{
		height: 32px;
		width: 52px;
		border-radius: 16px;
		display: inline-block;
		position: relative;
		margin: 0;
		border: 2px solid #474755ab;
		background: linear-gradient(180deg, #2d2f39ab 0%, #1f2027ab 100%);
		transition: all .2s ease;
	}

	.toggle:after{
		content: '';
		position: absolute;
		top: 2px;
		left: 2px;
		width: 24px;
		height: 24px;
		border-radius: 50%;
		background: white;
		box-shadow: 0 1px 2px rgba(44,44,44,.2);
		transition: all .2s cubic-bezier(.5,.1,.75,1.35);
	}

	.toggle:checked{
		border-color: lightgray;
	}

	.toggle:checked::after{
		transform: translatex(20px);
	}

	label {
		text-align: right;
		clear: both;
		float:left;
		margin-right:15px;
		vertical-align: middle;
	}

	.checkbox-container{
		display:flex;
		flex-direction: row;
		justify-content: space-between;
		align-items: center;
		margin: 10px;
	}

	.headline{
		text-align: center;
		font-weight: 200;
		font-size: larger;
		margin-bottom: 5px;
	}

	.hidden{
		display: none;
	}

	.control-container{
		display: flex;
		flex-direction: row;
		justify-content: center;
	}

	.wide-button-bottom{
		width: 80%; 
		height: 40px; 
		margin: 10px; 
		padding: 5px;
		background-color: rgba(147, 147, 158, 0.4);
	}

	.arrow-button{
		width: 70px; 
		height: 70px;
		background-color: rgba(147, 147, 158, 0.4);
	}

	.tetris-button-bottom{
		width: 105px; 
		height: 40px; 
		margin: 5px;
		background-color: rgba(147, 147, 158, 0.4);
	}

	img{
		-moz-user-select: none;
		-webkit-user-select: none;	
		user-select: none;
	}

	.setting-button{
		position: absolute;
		padding: 10px;
	}

	.settings-container{
		height: 0px;
		transition: height 1s;
		overflow: hidden;
	}

	.show{
		height: 280px;
		transition: height 1s;
	}

	.number-container{
		display:flex;
		flex-direction: row;
		justify-content: left;
		align-items: center;
		margin: 10px;
	}

	.save-button{
		height: 30px; 
		margin: 5px; 
		background-color: rgba(147, 147, 158, 0.4);
	}

	.info-text {
    font-size: small;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 15px;
    margin-bottom: 5px;
    text-align: center;
	}

	.custom-container {
    	/* Richtet die Elemente im Inneren (Text, Button) linksbündig aus */
    	display: flex;
    	flex-direction: column;
    	align-items: flex-start; /* Das ist der entscheidende Befehl für linksbündig */
    	padding-left: 10px; /* Etwas Abstand zum linken Rand */
	}
  
	</style>

		<script>

			var xmlhttp = new XMLHttpRequest();
			var url = "./data?key=mode";
			var myVar = null;

			xmlhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					console.log(this.responseText);
					myVar = JSON.parse(this.responseText);
					// set mode button state
					var state = myVar.modeid;
					var modebuttons = document.getElementsByClassName("dot-mode");
					for (const element of modebuttons){
						element.classList.remove("active");
					}
					modebuttons[state].classList.add("active");

					// set checkbox states
					var ckb_nightmodeactivated = document.querySelector('input[id="NightMode"]');
					if(myVar.nightModeActivated == "1") {
						console.log("nightmodeactivated == 1");
						ckb_nightmodeactivated.checked = true;
					}
					else {
						console.log("nightmodeactivated == 0");
						ckb_nightmodeactivated.checked = false;
					}
					ckb_nightmodeactivated.addEventListener('change', () => {
						if(ckb_nightmodeactivated.checked) {
							sendCommand("./cmd?nightmodeactivated=1");
						} else {
							sendCommand("./cmd?nightmodeactivated=0");
						}
					});

					// set checkbox states
					var ckb_ledoff = document.querySelector('input[id="LED_Off"]');
					if(myVar.ledoff == "1") {
						console.log("ledoff == 1");
						ckb_ledoff.checked = true;
					}
					else {
						console.log("ledoff == 0");
						ckb_ledoff.checked = false;
					}
					ckb_ledoff.addEventListener('change', () => {
						if(ckb_ledoff.checked) {
							sendCommand("./cmd?ledoff=1");
						} else {
							sendCommand("./cmd?ledoff=0");
						}
					});

					var ckb_stateautochange = document.querySelector('input[id="AutoChange"]');
					if(myVar.stateAutoChange == "1") {
						console.log("stateAutoChange == 1");
						ckb_stateautochange.checked = true;
					}
					else {
						console.log("stateAutoChange == 0");
						ckb_stateautochange.checked = false;
					}
					ckb_stateautochange.addEventListener('change', () => {
						if(ckb_stateautochange.checked) {
							sendCommand("./cmd?stateautochange=1");
						} else {
							sendCommand("./cmd?stateautochange=0");
						}
					});

					var ckb_colorshift = document.querySelector('input[id="ColorShift"]');
					if(myVar.colorshift == "1") {
						console.log("colorshift == 1");
						ckb_colorshift.checked = true;
					}
					else {
						console.log("colorshift == 0");
						ckb_colorshift.checked = false;
					}
					ckb_colorshift.addEventListener('change', () => {
						if(ckb_colorshift.checked) {
							document.getElementById("colorcontainer").classList.add("hidden");
							sendCommand("./cmd?colorshift=1");
						} else {
							document.getElementById("colorcontainer").classList.remove("hidden");
							sendCommand("./cmd?colorshift=0");
						}
					});
					
					document.getElementById("nm_start").value = myVar.nightModeStart.replace("-", ":");
					document.getElementById("nm_end").value = myVar.nightModeEnd.replace("-", ":");
					document.getElementById("brightness").value = parseInt(myVar.brightness);
					document.getElementById("colorshiftspeed").value = parseInt(myVar.colorshiftspeed);

					// Wert für den Rainbow-Slider setzen
					if(myVar.rainbowspeed) {
						document.getElementById("rainbowspeed").value = parseInt(myVar.rainbowspeed);
					}
					// Werte für die Ambient-Controls setzen
					if(myVar.ambient_mode) {
						document.getElementById("ambient_mode_select").value = myVar.ambient_mode;
					}
					// Wert für den Ambient-Helligkeits-Slider setzen
          			if(myVar.ambient_brightness) {
						document.getElementById("ambientbrightness_slider").value = parseInt(myVar.ambient_brightness);
					}
					if(myVar.ambient_speed) {
						document.getElementById("ambientspeed").value = parseInt(myVar.ambient_speed);
					}
					if(myVar.ambient_color) {
						// Der ESP sendet "rrggbb", der Farbwähler braucht aber "#rrggbb"
						document.getElementById("ambientcolor").value = "#" + myVar.ambient_color;
					}


					updateDisplay(parseInt(myVar.modeid));
					console.log(myVar);
				}
			};
			xmlhttp.open("GET", url, true);
			xmlhttp.send();
			
			function modechange(element, value){
				console.log(element);
				var modebuttons = document.getElementsByClassName("dot-mode");
				for (const element of modebuttons){
					element.classList.remove("active");
				}
				element.classList.add("active");

				updateDisplay(value);
			}

			function updateDisplay(modeid){

				var maincontainer = document.getElementsByClassName("main-container");
				for (const element of maincontainer){
					element.classList.add("hidden");
				}
				if(myVar != null && myVar.stateAutoChange == "0"){
					switch(modeid){
						case 0: // clock
							var ckb_colorshift = document.querySelector('input[id="ColorShift"]');
							if(!ckb_colorshift.checked) {
								document.getElementById("colorcontainer").classList.remove("hidden");
							}
							document.getElementById("colorshiftcontainer").classList.remove("hidden");
							break;
						case 1: // diclock
							document.getElementById("colorcontainer").classList.remove("hidden");
							document.getElementById("colorshiftcontainer").classList.add("hidden");
							break;
						case 2: // spiral
							document.getElementById("colorshiftcontainer").classList.add("hidden");
							break;
						case 3: // tetris
							document.getElementById("tetriscontainer").classList.remove("hidden");
							document.getElementById("colorshiftcontainer").classList.add("hidden");
							break;
						case 4: // snake
							document.getElementById("snakecontainer").classList.remove("hidden");
							document.getElementById("colorshiftcontainer").classList.add("hidden");
							break;
						case 5: // pingping
							document.getElementById("pongcontainer").classList.remove("hidden");
							document.getElementById("colorshiftcontainer").classList.add("hidden");
							break;
						// NEUer RainbowModus
						case 6: // Rainbow
							document.getElementById("rainbowcontainer").classList.remove("hidden"); // unseren Slider anzeigen
							document.getElementById("colorshiftcontainer").classList.add("hidden"); // ColorShift ausblenden
							break;

					}
				}
				
			}

			function sendCommand(command){
				var xmlhttp = new XMLHttpRequest();
				xmlhttp.open("GET", command, true);
				xmlhttp.send();
			}

			function saveAmbientSettings() {
				console.log("Sending ambient_save command to ESP...");
				sendCommand('./cmd?ambient_save');
			}

			function saveSettings(){
				var nmStart = document.getElementById("nm_start");
				var nmEnd = document.getElementById("nm_end");
				var sld_brightness = document.getElementById("brightness");
				var sld_colorshiftspeed = document.getElementById("colorshiftspeed");
				var ckb_resetWifi = document.querySelector('input[id="ResetWifi"]');
				var cmdstr = "./cmd?setting=";
				cmdstr += nmStart.value.replace(":", "-");
				cmdstr += "-";
				cmdstr += nmEnd.value.replace(":", "-");
				cmdstr += "-";
				cmdstr += sld_brightness.value;
				cmdstr += "-";
				cmdstr += sld_colorshiftspeed.value;
				console.log(cmdstr);
				sendCommand(cmdstr);
				if(ckb_resetWifi.checked) {
					sendCommand("./cmd?resetwifi");
				}
				toggleSettings();
			}

			function toggleSettings(){
				var container = document.getElementById("settings-container");
				if(container.classList.contains("show")){
					container.classList.remove("show");
				}
				else {
					container.classList.add("show");
				}
			}

			// format of return string: YYYY-MM-DD-HH-MM-SS)
			function getBrowserTime() {
				const now = new Date();
				const year = now.getFullYear();
				const month = String(now.getMonth() + 1).padStart(2, '0'); // Monate sind 0-indiziert
				const day = String(now.getDate()).padStart(2, '0');
				const hours = String(now.getHours()).padStart(2, '0');
				const minutes = String(now.getMinutes()).padStart(2, '0');
				const seconds = String(now.getSeconds()).padStart(2, '0');
				return `${year}-${month}-${day}-${hours}-${minutes}-${seconds}`;
			}
			
			// send browser time to Wordclock
			function saveBrowserTime()	{
				const browserTime = getBrowserTime();
				//console.log("Aktuelle Browserzeit:", browserTime);	//debug in browser console
				var cmdstr = "./cmd?setBrowserTime=";
				cmdstr += encodeURIComponent(browserTime);
				console.log(cmdstr);	//debug url
				sendCommand(cmdstr);
				toggleSettings();	//close settings menue
				alert("UHR syncronisiert");		//optional message to user
			}
			
		</script>
